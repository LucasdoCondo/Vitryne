<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitryne Quick Links</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div class="brand-mark" aria-hidden="true">V</div>
        <div>
          <p class="eyebrow">VITRYNE CONNECTOR</p>
          <h1>Acessos rápidos</h1>
        </div>
        <span class="local-badge">LOCAL</span>
      </header>

      <p class="description">Abra os portais oficiais no seu navegador.</p>

      <section class="group" aria-labelledby="affiliate-heading">
        <h2 id="affiliate-heading">Programas de afiliados</h2>
        <div class="link-grid">
          <button class="link-card" data-url="https://affiliate.shopee.com.br/" type="button">
            <span class="brand-icon shopee">S</span><span>Shopee</span><span class="external" aria-hidden="true">↗</span>
          </button>
          <button class="link-card" data-url="https://www.mercadolivre.com.br/afiliados" type="button">
            <span class="brand-icon mercado">ML</span><span>Mercado Livre</span><span class="external" aria-hidden="true">↗</span>
          </button>
          <button class="link-card" data-url="https://associados.amazon.com.br/" type="button">
            <span class="brand-icon amazon">a</span><span>Amazon</span><span class="external" aria-hidden="true">↗</span>
          </button>
          <button class="link-card" data-url="https://br.shein.com/" type="button">
            <span class="brand-icon shein">S</span><span>SHEIN</span><span class="external" aria-hidden="true">↗</span>
          </button>
        </div>
      </section>

      <section class="group" aria-labelledby="social-heading">
        <h2 id="social-heading">Redes sociais</h2>
        <div class="link-grid">
          <button class="link-card" data-url="https://business.facebook.com/" type="button">
            <span class="brand-icon facebook">f</span><span>Facebook</span><span class="external" aria-hidden="true">↗</span>
          </button>
          <button class="link-card" data-url="https://www.instagram.com/" type="button">
            <span class="brand-icon instagram">◎</span><span>Instagram</span><span class="external" aria-hidden="true">↗</span>
          </button>
          <button class="link-card" data-url="https://www.tiktok.com/" type="button">
            <span class="brand-icon tiktok">♪</span><span>TikTok</span><span class="external" aria-hidden="true">↗</span>
          </button>
          <button class="link-card" data-url="https://discord.com/app" type="button">
            <span class="brand-icon discord">◉</span><span>Discord</span><span class="external" aria-hidden="true">↗</span>
          </button>
          <button class="link-card" data-url="https://x.com/" type="button">
            <span class="brand-icon network-x">X</span><span>X</span><span class="external" aria-hidden="true">↗</span>
          </button>
        </div>
      </section>

      <footer class="privacy-note">
        <span class="privacy-indicator" aria-hidden="true"></span>
        <p>O login ocorre no site oficial. Esta extensão não lê, armazena nem envia senhas, cookies ou sessões.</p>
      </footer>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
